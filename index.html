<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container">
        <h1 class="brand">Odin Library</h1>

        <a
          href="https://github.com/rimanz/odin-library"
          class="source-link"
          target="_blank"
          noreferrer
          noopener
          >View source</a
        >
      </div>
    </header>

    <!-- Main Content Area -->
    <main>
      <div class="container">
        <div class="welcome">
          <p class="welcome-text">
            Track your books. Update their status. Keep things organized.
          </p>
        </div>

        <div class="showcase">
          <!-- Book elements will be added here by JavaScript. -->

          <button class="add-book">
            <span>&plus;</span>
          </button>
        </div>
      </div>

      <dialog>
        <span class="btn-close">&times;</span>

        <form action="" method="dialog">
          <label for="title">Book Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. Atomic Habits"
            minlength="1"
            required
          />

          <label for="author">Author</label>
          <input
            type="text"
            id="author"
            name="author"
            placeholder="e.g. James Clear"
            minlength="2"
            required
          />

          <label for="pages">Pages</label>
          <input
            type="number"
            id="pages"
            name="pages"
            placeholder="e.g. 300"
            min="3"
            required
          />

          <input type="checkbox" id="read" name="read" />
          <label for="title">Is Read?</label>

          <button type="submit" id="add-btn">Add Book</button>
        </form>
      </dialog>
    </main>

    <!-- Footer -->
    <footer>
      <div class="container">
        <p>Copyright &copy; 2025 Riman Das</p>
      </div>
    </footer>
  </body>
</html>
